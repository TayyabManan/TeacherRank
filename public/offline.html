<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - TeacherRank</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .offline-container {
      background: white;
      border-radius: 16px;
      padding: 48px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      background: #f3f4f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .offline-icon svg {
      width: 60px;
      height: 60px;
      fill: #9ca3af;
    }
    
    h1 {
      color: #111827;
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 700;
    }
    
    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #5a67d8;
    }
    
    button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.364 5.636l-1.414 1.414A6.978 6.978 0 0119 12c0 1.932-.784 3.682-2.05 4.95l1.414 1.414A8.964 8.964 0 0021 12a8.964 8.964 0 00-2.636-6.364zM5.636 5.636A8.964 8.964 0 003 12c0 2.486 1.006 4.734 2.636 6.364l1.414-1.414A6.978 6.978 0 015 12c0-1.932.784-3.682 2.05-4.95L5.636 5.636z"/>
        <path d="M15.536 8.464l-1.415 1.415A3.988 3.988 0 0115 12a3.99 3.99 0 01-.879 2.121l1.415 1.415A5.978 5.978 0 0017 12a5.978 5.978 0 00-1.464-3.536zM8.464 8.464A5.978 5.978 0 007 12c0 1.326.43 2.55 1.464 3.536l1.415-1.415A3.99 3.99 0 019 12c0-.842.261-1.621.879-2.121L8.464 8.464z"/>
        <path d="M12 14a2 2 0 100-4 2 2 0 000 4z"/>
        <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      Some features may be unavailable until you're back online.
    </p>
    
    <button onclick="window.location.reload()">
      Try Again
    </button>
  </div>
  
  <script>
    // Check for connection restoration
    window.addEventListener('online', () => {
      window.location.reload()
    })
  </script>
</body>
</html>
