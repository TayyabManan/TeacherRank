<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Define gradient matching the website -->
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background with gradient -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#purpleGradient)"/>
  
  <!-- Graduation cap emoji -->
  <text x="50" y="70" font-size="60" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif">🎓</text>
</svg>