    <!-- Apply the saved theme before first paint (prevents a flash of the wrong theme).
         Mirrors ThemeContext: key 'teachrank-theme' with 'light' | 'dark' | 'system'. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('teachrank-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">
      <noscript>
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f3f4f6; padding: 20px;">

          </div>
        </div>
      </noscript>
    </div>
    
    <!-- Offline detection and error handling -->
    <script>
      // Add offline/online detection
      window.addEventListener('load', function() {
        function updateOnlineStatus() {
          if (!navigator.onLine) {
            showOfflineMessage();
          }
        }
        
        function showOfflineMessage() {
          const root = document.getElementById('root');
          if (root && !root.querySelector('.app-loaded')) {
            root.innerHTML = `
              <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f3f4f6; padding: 20px;">
                <div style="text-align: center; max-width: 400px;">
                  <svg style="width: 64px; height: 64px; margin: 0 auto 16px; color: #9ca3af;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"></path>
                  </svg>
                  <h1 style="font-size: 24px; font-weight: bold; color: #111827; margin-bottom: 16px;">No Internet Connection</h1>
                  <p style="color: #6b7280; margin-bottom: 24px;">Please check your internet connection and try again.</p>
                  <button onclick="location.reload()" style="background: #7c3aed; color: white; padding: 10px 24px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer;">
                    Retry
                  </button>
                </div>
              </div>
            `;
          }
        }
        
        window.addEventListener('online', function() {
          location.reload();
        });
        
        window.addEventListener('offline', updateOnlineStatus);
        
        // Check initial status
        updateOnlineStatus();
        
        // Handle module loading errors
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || 
              e.message.includes('importing a module failed'))) {
            if (!navigator.onLine) {
              showOfflineMessage();
            } else {
              const root = document.getElementById('root');
              if (root && !root.querySelector('.app-loaded')) {
                root.innerHTML = `
                  <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f3f4f6; padding: 20px;">
                    <div style="text-align: center; max-width: 400px;">
                      <svg style="width: 64px; height: 64px; margin: 0 auto 16px; color: #ef4444;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                      </svg>
                      <h1 style="font-size: 24px; font-weight: bold; color: #111827; margin-bottom: 16px;">Loading Error</h1>
                      <p style="color: #6b7280; margin-bottom: 24px;">Unable to load the application. Please check your internet connection or try clearing your browser cache.</p>
                      <button onclick="location.reload()" style="background: #7c3aed; color: white; padding: 10px 24px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer; margin-right: 8px;">
                        Retry
                      </button>
                      <button onclick="caches.delete('teacher-rank-v1').then(() => location.reload())" style="background: #6b7280; color: white; padding: 10px 24px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer;">
                        Clear Cache
                      </button>
                    </div>
                  </div>
                `;
              }
            }
          }
        });
      });
    </script>
