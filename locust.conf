# Locust Configuration File for Teacher Rank Load Testing

# Target host - Update this to your actual deployment URL
host = http://localhost:5173
# For production testing, use:
# host = https://your-deployed-site.vercel.app

# Number of users to simulate
users = 100

# Spawn rate (users per second)
spawn-rate = 10

# Run time (e.g., 10m for 10 minutes, 1h for 1 hour)
run-time = 5m

# Locust web UI settings
web-host = 0.0.0.0
web-port = 8089

# Headless mode settings (for CI/CD)
# headless = true
# only-summary = true

# CSV output for results
csv = load_test_results
csv-full-history = true

# HTML report
html = load_test_report.html

# Log level
loglevel = INFO

# Stop on error percentage
stop-timeout = 10