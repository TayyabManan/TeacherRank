name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      # `type-check` runs tsc but never Rollup, so build-only failures — a bad
      # path in vite.config.js manualChunks, a plugin error — used to reach
      # Vercel unverified. ~30s to close that gap.
      - name: Build
        run: npm run build
